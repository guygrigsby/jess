name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet + race tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: jess
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # cache: true is the default in setup-go v5+ but spelling it out
          # so a future ratchet doesn't silently bust caching.
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        # E2E test in memory/embed/gomlx downloads ~90MB; gated on
        # JESS_EMBEDDER_E2E env var so CI doesn't pay it. Set in a
        # separate workflow when we want pre-release verification.
        env:
          JESS_TEST_POSTGRES_DSN: postgres://postgres:jess@127.0.0.1:5439/postgres?sslmode=disable
        run: go test -race -timeout 5m ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # golangci-lint-action manages its own build/analysis cache;
          # disable setup-go's to avoid the documented cache conflict.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible lint results: a floating version can
          # surface new findings that break unrelated PRs. Bump deliberately.
          version: v2.12.2

  license-audit:
    name: license-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: license-audit
        # Blocking: a GPL/AGPL dep violates the project license policy
        # (MIT/Apache-2.0/MPL-2.0/BSD only) and must fail the PR.
        run: make license-audit

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        # Non-blocking: vuln findings in deep transitive deps
        # shouldn't fail PRs without a maintainer call. Surfaces
        # in the CI log for visibility.
        run: govulncheck ./... || true
